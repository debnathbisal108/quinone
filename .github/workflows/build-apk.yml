```yaml
name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Show installed versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Verify Flutter project
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            echo "Error: pubspec.yaml was not found."
            exit 1
          fi

          if [ ! -d "android" ]; then
            echo "Error: android directory was not found."
            echo "Generate it locally with: flutter create . --platforms=android"
            echo "Then commit the android directory to GitHub."
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Build release APK
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "Error: API_BASE_URL GitHub secret is not configured."
            exit 1
          fi

          flutter build apk \
            --release \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: quinone-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
```
