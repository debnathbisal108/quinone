name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Show installed versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Verify Flutter project
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            echo "Error: pubspec.yaml was not found."
            exit 1
          fi

          if [ ! -d "lib" ]; then
            echo "Error: lib directory was not found."
            exit 1
          fi

          if [ ! -f "lib/main.dart" ]; then
            echo "Error: lib/main.dart was not found."
            exit 1
          fi

      - name: Create Android platform
        run: |
          if [ ! -d "android" ]; then
            flutter create . \
              --platforms=android \
              --project-name=quinone \
              --org=com.quinone
          fi

          rm -f test/widget_test.dart

      - name: Prepare asset directories
        run: |
          mkdir -p assets/images
          mkdir -p assets/icons
          mkdir -p assets/animations

      - name: Set Android SDK 35
        run: |
          if [ -f "android/app/build.gradle" ]; then
            sed -i \
              's/compileSdk flutter.compileSdkVersion/compileSdk 35/' \
              android/app/build.gradle

            sed -i \
              's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/' \
              android/app/build.gradle
          fi

          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i \
              's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' \
              android/app/build.gradle.kts
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: quinone-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
