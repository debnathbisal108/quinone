name: quinone
description: AI-powered nutrition intelligence platform.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # -------------------------------
  # State Management
  # -------------------------------
  flutter_riverpod: ^2.6.1
  reorderable_grid_view: ^2.2.8

  # -------------------------------
  # Networking
  # -------------------------------
  dio: ^5.7.0

  # -------------------------------
  # Routing
  # -------------------------------
  go_router: ^14.6.2

  # -------------------------------
  # Image Handling
  # -------------------------------
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  image: ^4.3.0

  # -------------------------------
  # Local Storage
  # -------------------------------
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  flutter_local_notifications: 19.5.0
  flutter_foreground_task: ^11.0.0
  timezone: 0.10.1
  # -------------------------------
  # Utilities
  # -------------------------------
  intl: ^0.20.1
  uuid: ^4.5.1
  equatable: ^2.0.7
  collection: ^1.18.0

  # -------------------------------
  # Animations
  # -------------------------------
  flutter_animate: ^4.5.2

  # -------------------------------
  # UI
  # -------------------------------
  flutter_staggered_grid_view: ^0.7.0
  reorderables: ^0.6.0
  cached_network_image: ^3.4.1

  # -------------------------------
  # JSON
  # -------------------------------
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  build_runner: ^2.4.13
  json_serializable: ^6.9.0

flutter:

  uses-material-design: true
